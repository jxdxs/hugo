<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body><header><div class="wrap nav"><a class="brand" href="{{ "" | relURL }}">{{ .Site.Title }}</a><nav><a class="nav-pill" href="{{ "categories/agent/" | relURL }}">Agent</a><a class="nav-pill" href="{{ "categories/技术/" | relURL }}">技术</a><a class="nav-pill" href="{{ "categories/随笔/" | relURL }}">随笔</a><a class="nav-pill" href="{{ "tags/" | relURL }}">标签</a></nav></div></header>
<main class="wrap">{{ block "main" . }}{{ end }}</main>
<footer><div class="wrap">© {{ now.Year }} {{ .Site.Params.author }} · Powered by Hugo</div></footer></body>
</html>

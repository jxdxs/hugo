<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body><header><div class="wrap nav"><a class="brand" href="{{ "" | relURL }}">{{ .Site.Title }}</a><nav><a href="{{ "" | relURL }}">首页</a><a href="{{ "posts/" | relURL }}">文章</a></nav></div></header>
<main class="wrap">{{ block "main" . }}{{ end }}</main>
<footer><div class="wrap">© {{ now.Year }} {{ .Site.Params.author }} · Powered by Hugo</div></footer></body>
</html>

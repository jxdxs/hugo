<article class="card"><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><div class="meta">{{ .Date.Format "2006-01-02" }}{{ with .Params.categories }} · 分类：{{ range $i, $v := . }}{{ if $i }} / {{ end }}<a href="{{ (printf "categories/%s/" ($v | urlize)) | relURL }}">{{ $v }}</a>{{ end }}{{ end }}{{ with .Params.tags }} · 标签：{{ range $i, $v := . }}{{ if $i }} / {{ end }}<a href="{{ (printf "tags/%s/" ($v | urlize)) | relURL }}">{{ $v }}</a>{{ end }}{{ end }}</div>{{ with .Description }}<p>{{ . }}</p>{{ end }}</article>
